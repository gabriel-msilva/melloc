name: Test/Build/Deploy

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - README.md

jobs:
  test:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  build:
    needs: [test]
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          lfs: true

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install Hugo
        shell: bash -el {0}
        run: Rscript -e 'blogdown::install_hugo(getOption("blogdown.hugo.version"))'

      - name: Build site
        shell: bash -el {0}
        run: Rscript -e 'blogdown::build_site(build_rmd = TRUE)'

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          name: melloc
          path: public/

  deploy:
    needs: [build]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-20.04
    environment:
      name: github-pages
      url: https://gabriel-msilva.github.io/melloc/
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          lfs: true

      - name: Clean working dir
        run: |
          rm -rf *
          touch .nojekyll

      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: melloc

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "noreply@github.com"

      - name: Check changes
        id: check
        run: |
          lines=`git diff --name-only | wc -l`
          if [ $lines -gt 0 ]; then changed="true"; else changed="false"; fi
          echo "changed=$changed" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check.outputs.changed
        run: |
          SHA=${{ github.sha }}

          git add .
          git commit -m "CI: Update site (${{ github.run_number }} - ${SHA:0:7})"
          git push origin
